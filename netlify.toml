[build]
  publish = "."
  command = "node scripts/i18n-catalog.mjs && node scripts/optimize.mjs && node scripts/headers.mjs"

# Security headers for every page. The Content-Security-Policy is generated at deploy time
# (scripts/headers.mjs → _headers) so it can list the exact hashes of the inline scripts.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), fullscreen=(self), payment=(self \"https://js.stripe.com\" \"https://app.lemonsqueezy.com\"), screen-wake-lock=(self), web-share=(self), clipboard-write=(self), display-capture=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), magnetometer=(self), gyroscope=(self), accelerometer=(self), browsing-topics=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/pwa/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

# Store listings and install prompts (PWABuilder, Microsoft Store, Chrome) fetch these cross-origin.
[[headers]]
  for = "/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

# Windows widget template + default data (read by the widgets board).
[[headers]]
  for = "/widgets/*"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# Bubblewrap / PWA tooling often looks for /manifest.json — serve the same web manifest there.
[[redirects]]
  from = "/manifest.json"
  to = "/manifest.webmanifest"
  status = 200
  force = true

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

# Share target fallback: before the service worker is active, a shared item lands here.
# The service worker normally answers POST /share-target itself.
[[redirects]]
  from = "/share-target"
  to = "/?source=share"
  status = 302
  force = true
