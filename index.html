(function(){

    var vv=window.visualViewport; if(!vv) return 0;
    /* Only a focused text field can open the keyboard; a pinch-zoomed or toolbar-resized viewport is not a keyboard. */
    var a=document.activeElement, tag=a&&a.tagName;
